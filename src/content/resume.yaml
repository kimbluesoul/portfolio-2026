  about:
    heading: 關於我
    eyebrow: ABOUT
    body: |-
      你好，我是泫淇，目前主要從事 UI 與視覺設計相關工作。大學就讀資訊工程系，一開始是因為喜歡遊戲與數位內容而選擇這個科系，後來在課程中接觸到使用者體驗與介面設計，才慢慢發現自己真正有興趣的方向是設計。雖然最後沒有往程式開發發展，但資訊背景讓我在與前端工程師合作時，比較能理解設計實際製作與落地時會遇到的問題。

      過去幾年的工作經驗主要涵蓋網站、RWD、數位平台與 APP UI。早期以網站專案為主，從收到案件後與客戶確認需求、安排設計時程、提出首頁提案，到延伸內頁與 RWD 設計，前端切版完成後也會再進行畫面驗收與修改。這段經驗讓我熟悉一個網站從需求確認到實際完成的流程，也累積了不少與客戶溝通及整理需求的經驗；我也特別喜歡替網站規劃動態，讓內容的進場與轉場更有節奏、更好閱讀。

      後來的工作則以遠端方式，接觸到更多不同平台的 UI 與視覺設計，包含 PC、H5、Mobile、APP、Prototype、活動視覺與 Icon 等，也需要和產品及前端工程師一起討論與調整。比起單純完成一張畫面，我會比較在意整體的視覺是否一致、資訊是否清楚，以及最後實際做出來的效果是不是符合原本的設計。

      這幾年隨著 AI 工具快速發展，我也開始把 AI 加進自己的工作流程，用來協助素材製作、視覺方向探索與一些重複性的工作。對我來說它是一個提高效率的工具，但最後該怎麼取捨、怎麼讓畫面變得更完整，還是需要設計本身的判斷。平常喜歡畫畫、看電影、玩遊戲，也習慣看看不同網站、APP 或其他設計作品，這些一直都是很自然的靈感來源。

      未來我希望繼續往 UI 與數位產品設計發展。比起只把畫面做完，我更希望參與產品從需求、設計到實際上線的過程，也持續累積自己在介面、互動與產品判斷上的能力。

overview:
  heading: |-
    不像網站，
    **更像一份會動的簡報**
  blocks:
    - title: 背景
      body: 這個案子不以操作效率為優先，而是重視瀏覽時的體驗。代價是門檻變高：有些地方不容易看出能點擊，捲動時也難預期內容從哪裡出現。
    - title: 過程
      body: 我先找類似網站給客戶參考，再把動態做進原型讓客戶看效果。最後客戶很滿意成果。
    - title: 挑戰
      body: 最難的是把客戶的資料放進這樣的版面：每段都要排得合理，文字又不能顯得單薄。
  outputs: [企業網站, Motion]
keyScreens:
  eyebrow: DESKTOP
  heading: 一進站，先看見**品牌**
  subtitle: 客戶希望由品牌 Logo 帶出轉場，我找來線稿建築搭配，開場乾淨、有份量；往下滾動後，內容一個區塊一個區塊地展開。
  main:
    kind: video
    src: /media/huifa/key-main.mp4
    poster: ../../assets/projects/huifa/key-main-poster.jpg
    alt: 匯發營造網站 PC 首頁捲動
    aspectRatio: 2528 / 1216
  closeups:
    - title: 執行準則
      caption: 從文字稿出發，把 PLAN 到 ACTION 五個步驟一字排開說清楚。
      media:
        kind: image
        src: ../../assets/projects/huifa/key-guidelines.jpg
        alt: 執行準則區塊特寫
        aspectRatio: 458.67 / 300
    - title: 工程實績
      caption: 客戶提供的建案照片與工程數據，整理成一目了然的實績區塊。
      media:
        kind: image
        src: ../../assets/projects/huifa/key-projects.jpg
        alt: 工程實績區塊特寫
        aspectRatio: 458.67 / 300
    - title: 服務項目
      caption: 側邊圖示導覽，逐項切換各類工程內容。
      media:
        kind: image
        src: ../../assets/projects/huifa/key-services.jpg
        alt: 服務項目區塊特寫
        aspectRatio: 458.67 / 300
motion:
  eyebrow: INTERACTION & MOTION
  heading: 每一次滾動，都是一次換頁
  subtitle: 動態由我設計，並在原型中示範怎麼動，前端再依原型還原。手機版的捲動效果較少，我設計首頁的呈現，其餘由前端調整成適合手機的瀏覽方式。
  steps:
    - title: 01　一頁一畫面
      body: 每個區塊都是一個完整畫面，像簡報一樣一頁講一件事。
      media:
        kind: video
        src: /media/huifa/motion-1.mp4
        poster: ../../assets/projects/huifa/motion-1-poster.jpg
        alt: 一頁一畫面
        aspectRatio: 2528 / 1216
    - title: 02　內容進場
      body: 標題、圖片和文字依序出現，視線跟著走。
      media:
        kind: video
        src: /media/huifa/motion-2.mp4
        poster: ../../assets/projects/huifa/motion-2-poster.jpg
        alt: 內容進場
        aspectRatio: 2528 / 1216

overview:
  heading: |-
    不像網站，
    **更像一份會動的簡報**
  blocks:
    - title: 背景
      body: 客戶完全不想要一般網站的瀏覽方式，希望整個網站特別一點，不以操作效率為優先，而是重視瀏覽時的體驗。
    - title: 過程
      body: 一邊和客戶確認需求，一邊依照期望調整設計，把想像中的瀏覽方式一步步具體化，最後真的做成網站。
    - title: 挑戰
      body: 回頭看，有些部分真的很像在做投影片：每段內容要怎麼進場、怎麼轉到下一個區塊才自然，都需要一格一格安排。
  outputs: [企業網站, Motion]

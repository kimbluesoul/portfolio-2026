motion:
  eyebrow: INTERACTION & MOTION
  heading: 每一次滾動，都是一次換頁
  subtitle: 整個網站的動態就像投影片的轉場：每段內容怎麼進場、怎麼轉到下一個區塊，都經過安排，讓瀏覽的節奏自然流暢。
  steps:
    - title: 01　一頁一畫面
      body: 每個區塊都是一個完整畫面，像簡報一樣一頁講一件事。
      media:
        kind: video
        src: /media/huifa/motion-1.mp4
        poster: ../../assets/projects/huifa/card-poster.jpg
        alt: 一頁一畫面
        aspectRatio: 960 / 532
        status: pending
        expectedFile: public/media/huifa/motion-1.mp4
    - title: 02　內容進場
      body: 標題、圖片和文字依序出現，讓視線跟著內容走。
      media:
        kind: video
        src: /media/huifa/motion-2.mp4
        poster: ../../assets/projects/huifa/card-poster.jpg
        alt: 內容進場
        aspectRatio: 960 / 532
        status: pending
        expectedFile: public/media/huifa/motion-2.mp4
    - title: 03　區塊轉場
      body: 滾動時帶入下一個區塊，轉換自然，不會突然跳開。
      media:
        kind: video
        src: /media/huifa/motion-3.mp4
        poster: ../../assets/projects/huifa/card-poster.jpg
        alt: 區塊轉場
        aspectRatio: 960 / 532
        status: pending
        expectedFile: public/media/huifa/motion-3.mp4

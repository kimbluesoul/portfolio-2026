        alt: 展覽介紹區塊特寫
        aspectRatio: 458.67 / 300
        status: pending
        expectedFile: src/assets/projects/sss/key-intro.jpg
    - title: 展覽旅程
      caption: 把展區動線畫成立體地圖，從黑暗走向透明。
      media:
        kind: image
        src: ../../assets/placeholders/placeholder.png
        alt: 展覽旅程立體地圖特寫
        aspectRatio: 458.67 / 300
        status: pending
        expectedFile: src/assets/projects/sss/key-journey.jpg
    - title: 建物知情權
      caption: 用簡單的圖示與時間軸，把專業內容講清楚。
      media:

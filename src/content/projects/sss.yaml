motion:
  eyebrow: INTERACTION & MOTION
  heading: 每一次滾動，都有新東西
  subtitle: 整個網站大量運用視差滾動，和前端反覆溝通細節，讓超透明理念、旅程導覽與建物知情權，都能在互動中被看見、被吸收。
  steps:
    - title: 01　主視覺拆解
      body: 把 SSS 主視覺裡的元素拆開、單獨動起來，一進站就被吸引停留。
      media:
        kind: video
        src: /media/sss/motion-1.mp4
        poster: ../../assets/placeholders/placeholder.png
        alt: 主視覺拆解動態
        aspectRatio: 960 / 532
        status: pending
        expectedFile: public/media/sss/motion-1.mp4
    - title: 02　視差滾動
      body: 不同圖層以不同速度移動，每一次滾動都有新的元素進入畫面。
      media:
        kind: video
        src: /media/sss/motion-2.mp4
        poster: ../../assets/placeholders/placeholder.png
        alt: 視差滾動動態
        aspectRatio: 960 / 532
        status: pending
        expectedFile: public/media/sss/motion-2.mp4
    - title: 03　逐段揭露
      body: 從展覽介紹、旅程導覽到建物知情權，內容隨滾動分段出現，更好吸收。
      media:
        kind: video
        src: /media/sss/motion-3.mp4
        poster: ../../assets/placeholders/placeholder.png
        alt: 內容逐段揭露動態
        aspectRatio: 960 / 532
        status: pending
        expectedFile: public/media/sss/motion-3.mp4

overview:
  heading: |-
    一張主視覺，
    **動成一場展覽**
  blocks:
    - title: 背景
      body: 這是寶舖建設「SSS 超透明提案」展覽的活動頁。剛拿到需求和素材時覺得有些普通，主要就是一張 SSS 的圖，照片也不多。
    - title: 讓主視覺動起來
      body: 看到 SSS 主視覺時，就覺得它動起來一定更豐富有趣。於是拆解裡面的元素讓它們各自動起來，讓人一進站就被吸引停留。
    - title: 挑戰
      body: 素材有限，怎麼讓人願意看、願意互動是最大的難題。我和前端大量溝通視差滾動的效果，讓每一次滾動都有新元素進入。
  outputs: [活動頁面, 互動設計]
keyScreens:
  eyebrow: DESKTOP
  heading: 一進站，SSS 就**動起來**
  subtitle: 首頁把主視覺拆成一個個元素，讓它們各自動起來，搭配「世界唯一專為健康・安全建築解析的展覽」標語，第一眼就抓住目光。
  main:
    kind: video
    src: /media/sss/key-main.mp4

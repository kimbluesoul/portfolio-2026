  titleSizeMobile: 76
  headline: 超透明提案**展覽活動頁**設計
  subtitle: 素材不多，主視覺只有一張 SSS 的圖。我把主視覺拆開讓它動起來，再用視差滾動讓每次滑動都有新內容進場，把一場建築展變得想看、也想互動。

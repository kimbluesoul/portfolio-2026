motion:
  eyebrow: SERVICE FLOW
  heading: 服務流程，清楚也不無聊
  subtitle: 這個案子動態不多，重點放在服務流程的設計。連接線讓先後順序一目了然，圖示則增加趣味與版面美觀；線條圖示取自圖庫，我再逐一調整成一致。
  steps:
    - title: 01　圖示化步驟
      body: 每個步驟都搭配一致的線條圖示，讓繁瑣的流程不必細讀文字也能看懂。
      media:
        kind: video
        src: /media/jhanyu/motion-1.mp4
        poster: ../../assets/projects/jhanyu/motion-1-poster.jpg
        alt: 圖示化步驟
        aspectRatio: 2528 / 1216
    - title: 02　編號與版面節奏
      body: 橘色編號標籤與連接線帶出先後順序，流程、色塊與留白交錯安排，讓步驟多的頁面也有閱讀節奏。
      media:
        kind: video
        src: /media/jhanyu/motion-2.mp4
        poster: ../../assets/projects/jhanyu/motion-2-poster.jpg
        alt: 編號與版面節奏
        aspectRatio: 2528 / 1216

overview:
  heading: |-
    從 Logo 延伸，
    **讓亮橘撐起品牌**
  blocks:
    - title: 背景
      body: 建築雖然也能有識別度，但要看是什麼類型的建案；Logo 則各有特色。我判斷展裕的 Logo 非常適合延伸，於是把它當成網站設計的出發點。
    - title: 品牌延伸
      body: 亮橘是展裕的品牌色，我嘗試大面積使用。為了不讓橘色太搶，安排色塊時同時考慮視覺焦點與整體，並和白色背景交替，讓畫面有呼吸；手機版的色塊則收斂成一小區。客戶很喜歡這種整塊的重點感。
    - title: 挑戰
      body: 服務流程有三條、共 16 個步驟，客戶只提供文字和步驟。照一般方式排列會很枯燥，所以我用連接線拉出明確的順序主軸，讓人順著看下去。
  outputs: [企業網站, 品牌延伸]

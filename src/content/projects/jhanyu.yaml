overview:
  heading: |-
    從 Logo 延伸，
    **讓亮橘撐起品牌**
  blocks:
    - title: 背景
      body: 和客戶確認需求的過程很順利，沒有太多狀況，重點放在如何讓網站更有展裕建設自己的樣子。
    - title: 品牌延伸
      body: 大量延伸 Logo 的造型語言，把屋頂般的斜角變成版面裡的色塊與分割，再加入大面積的亮橘色，讓品牌感更鮮明。
    - title: 挑戰
      body: 服務流程的圖比較多，如何清楚呈現、又不讓內容顯得單調無聊，是這個案子印象最深的挑戰。
  outputs: [企業網站, 品牌延伸]
keyScreens:
  eyebrow: DESKTOP
  heading: 聚建築，也聚**品牌**
  subtitle: 首頁用建案實景大圖開場，往下以 Logo 延伸的斜角橘色塊串起關於展裕與品牌理念，讓建築和品牌一起被看見。
  main:
    kind: video
    src: /media/jhanyu/key-main.mp4
    poster: ../../assets/projects/jhanyu/key-main-poster.jpg

    aspectRatio: 2528 / 1216
  closeups:
    - title: 關於展裕
      caption: 斜角橘色塊延伸自 Logo，讓版面有品牌的節奏。
      media:
        kind: image
        src: ../../assets/projects/jhanyu/key-about.jpg
        alt: 關於展裕區塊特寫
        aspectRatio: 458.67 / 300
    - title: 熱銷建案
      caption: 實景照片搭配清楚的規格表，資訊一目了然。
      media:
        kind: image
        src: ../../assets/projects/jhanyu/key-projects.jpg
        alt: 熱銷建案區塊特寫
        aspectRatio: 458.67 / 300
    - title: 購屋簽約流程
      caption: 用圖示和步驟編號，把繁瑣的流程講清楚。
      media:
        kind: image
        src: ../../assets/projects/jhanyu/key-process.jpg
        alt: 購屋簽約流程特寫
        aspectRatio: 458.67 / 300
motion:
  eyebrow: SERVICE FLOW
  heading: 服務流程，清楚也不無聊
  subtitle: 這個案子動態不多，重點放在服務流程的設計。流程的圖量多，所以用一致的圖示、步驟標籤和連接線，讓每個流程清楚好讀，又延續品牌的視覺語言。
  steps:
    - title: 01　圖示化步驟
      body: 每個步驟都搭配一致的線條圖示，讓繁瑣的流程不必細讀文字也能看懂。
      media:
        kind: video
        src: /media/jhanyu/motion-1.mp4
        poster: ../../assets/projects/jhanyu/motion-1-poster.jpg
        alt: 圖示化步驟
        aspectRatio: 2528 / 1216
    - title: 02　編號與版面節奏
      body: 橘色編號標籤與連接線帶出先後順序，流程、色塊與留白交錯安排，讓圖量多的頁面清楚又不單調。
      media:
        kind: video
        src: /media/jhanyu/motion-2.mp4
        poster: ../../assets/projects/jhanyu/motion-2-poster.jpg
        alt: 編號與版面節奏
        aspectRatio: 2528 / 1216

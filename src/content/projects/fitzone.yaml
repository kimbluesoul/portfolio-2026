overview:
  heading: |-
    黑、黃與一道心跳，
    **撐起整個品牌**
  blocks:
    - title: 背景
      body: 客戶對網站沒有太多限制，主要希望把四大特點、品牌特色和課程內容清楚呈現，視覺和動態的方向幾乎都交給我決定。
    - title: 視覺延伸
      body: 色彩從 Logo 延伸，也大量參考健身房的黑黃色調與空間裝潢。客戶重視品牌，網站也不斷強調 60 分鐘、心肺訓練與後燃效應，所以我選了品牌 O 裡的心跳當主要識別，拆出來貫穿整個網站的圖示與按鈕。
    - title: 挑戰
      body: 發揮空間大，反而要先替網站定下方向。我參考他們的母品牌和其他運動品牌，並守住「清楚展示資料與課程」這條底線。一開始我把課程排得比較前面，客戶看過後調整了順序，我才知道他們更想先強調品牌、給人的感受和主要目標。
  outputs: [品牌網站, Motion]

motion:
  eyebrow: INTERACTION & MOTION
  heading: 快、清楚，而且有活力
  subtitle: Motion 的目標是活力、快速、清楚又鮮明，動作俐落不拖泥帶水，讓瀏覽的節奏就像一堂高強度訓練。我先用 Prototype 定下節奏交給前端；部分效果實作上做不到，上線版比設計簡化，但我堅持保留動態。
  steps:
    - title: 01　心跳識別
      body: 心跳線出現在 Logo、圖示和按鈕中，把品牌識別直接放進互動裡。
      media:
        kind: video
        src: /media/fitzone/motion-1.mp4
        poster: ../../assets/projects/fitzone/motion-1-poster.jpg
        alt: 心跳識別動態
        aspectRatio: 2528 / 1216
    - title: 02　俐落進場
      body: 區塊用短而快的位移進場，資訊一段段清楚出現，不拖慢瀏覽。
      media:
        kind: video
        src: /media/fitzone/motion-2.mp4
        poster: ../../assets/projects/fitzone/motion-2-poster.jpg
        alt: 區塊俐落進場動態
        aspectRatio: 2528 / 1216
    - title: 03　鮮明回饋
      body: 普通的方形按鈕少了一點動感，所以做成斜切。Hover 時用黃色色塊和斜切形狀即時回應，可點擊的地方一眼就看得出來。
      media:
        kind: video
        src: /media/fitzone/motion-3.mp4
        poster: ../../assets/projects/fitzone/motion-3-poster.jpg
        alt: 黃色色塊 Hover 回饋
        aspectRatio: 2528 / 1216

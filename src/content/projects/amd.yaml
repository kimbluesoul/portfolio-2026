motion:
  eyebrow: INTERACTION & MOTION
  heading: 連出錯的頁面，也有細節
  subtitle: 除了客戶指定的互動，我也特別替 404 與維護頁面加上動態，讓使用者在找不到頁面或網站維護時，依然感受得到品牌的用心。
  steps:
    - title: 01　404 頁面
      body: 找不到頁面時，手術燈與「Oops」插圖帶著動態出現，讓出錯的時刻輕鬆一點。
      media:
        kind: video
        src: /media/amd/motion-1.mp4
        poster: ../../assets/projects/amd/motion-1-poster.jpg
        alt: 404 頁面動態
        aspectRatio: 2528 / 1216
    - title: 02　維護頁面
      body: 網站維護時，螢幕與齒輪插圖也有動態，清楚告知狀態，同時延續品牌視覺。
      media:
        kind: video
        src: /media/amd/motion-2.mp4
        poster: ../../assets/projects/amd/motion-2-poster.jpg
        alt: 維護頁面動態
        aspectRatio: 2528 / 1216

overview:
  heading: |-
    先定英文版型，
    **再把需求一一接住**
  blocks:
    - title: 背景
      body: 康健生醫是醫療器材公司，主要客群在國外。我建議客戶開版時就使用英文，之後切換語言時，版型比較不會跑掉。
    - title: 過程
      body: 客戶一開始沒有太多想法，改了幾版之後，開始明確要求每個區塊要放哪些內容、期望有哪些動態，我在設計時也一併考慮進去。
    - title: 挑戰
      body: 客戶要求較多，互動內容也多。首頁產品區要使用描線的產品圖，需要額外處理，還要和整體視覺、動態保持一致。
  outputs: [企業網站, 互動設計]

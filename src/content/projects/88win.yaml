motion:
  eyebrow: INTERACTION & MOTION
  heading: 找遊戲的每一步，都有回應
  subtitle: 玩家在 88Win 最常做的事就是找遊戲。從滑入類別、挑選廠商或遊戲，到進入遊戲，每一步的回饋我都先用 Prototype 試過節奏。
  steps:
    - title: 01　滑入遊戲類別
      body: 滑過選單時列表跟著展開，選中的分類一眼就看得出來。
      media:
        kind: video
        src: /media/88win/motion-1.mp4
        poster: ../../assets/placeholders/placeholder.png
        alt: 滑入遊戲類別互動
        aspectRatio: 960 / 532
        status: pending
        expectedFile: public/media/88win/motion-1.mp4
    - title: 02　選擇廠商／遊戲
      body: 滑過遊戲卡片時給出回饋，知道這張點得到。
      media:
        kind: video
        src: /media/88win/motion-2.mp4
        poster: ../../assets/placeholders/placeholder.png
        alt: 選擇廠商與遊戲互動
        aspectRatio: 960 / 532
        status: pending
        expectedFile: public/media/88win/motion-2.mp4
    - title: 03　進入遊戲
      body: 從列表進到遊戲的轉場，讓畫面接得起來，不會突然跳走。
      media:
        kind: video
        src: /media/88win/motion-3.mp4
        poster: ../../assets/placeholders/placeholder.png
        alt: 進入遊戲轉場
        aspectRatio: 960 / 532
        status: pending
        expectedFile: public/media/88win/motion-3.mp4
details:
  eyebrow: COMPONENTS
  heading: '**一套元件**，撐起所有頁面'
  subtitle: 翻新時，我們把 Icon、顏色、按鈕、卡片都做成元件，讓整個網站模組化。之後換色或加新頁面，都從這套直接套用。
  items:
    - eyebrow: ICON
      title: 功能入口 Icon
      caption: 整套 icon 都是我自己設計、自己調色的。灰色是未選、藍色是選中，功能入口和底部導覽用同一種立體質感。
      size: half-tall
      media:
        kind: image
        src: ../../assets/projects/88win/detail-icon.png
        alt: 88Win Icon 元件規格
        aspectRatio: 637 / 550
    - eyebrow: COLOR
      title: 顏色
      caption: 以主色為中心，往深、淺兩側延伸。名稱裡的 100、200、300 代表深淺階層，工程師對照色票時直接用名稱就能找到對應色碼，不用猜。
      size: half
      media:
        kind: image
        src: ../../assets/placeholders/placeholder.png
        alt: 88Win 色彩元件規格
        aspectRatio: 647 / 140
        status: pending
        expectedFile: src/assets/projects/88win/detail-color.png
      mobileMedia:
        kind: image
        src: ../../assets/placeholders/placeholder.png
        alt: 88Win 色彩元件規格手機版
        aspectRatio: 310 / 280
        status: pending
        expectedFile: src/assets/projects/88win/detail-color-mobile.png
    - eyebrow: CATEGORY
      title: 分類側欄
      caption: 分類 icon 走活潑路線，圖案和配色都比較跳；選中時整顆換成主色藍，一眼就知道現在在哪個分類。
      size: half
      media:
        kind: image
        src: ../../assets/projects/88win/detail-category.png
        alt: 88Win 遊戲分類元件規格
        aspectRatio: 1320 / 300
    - eyebrow: CARD
      title: 遊戲圖面
      caption: 遊戲圖（方形）用同一張圖等比例縮放，各裝置共用；遊戲廠商圖（長方形）分成 PC 與 H5／App 兩種版本。另一種廠商圖只用在 PC 版，分成選中與未選中兩種狀態。
      size: full
      media:
        kind: image
        src: ../../assets/projects/88win/detail-card.png
        alt: 88Win 卡片元件規格
        aspectRatio: 1322 / 300
    - eyebrow: HEADER
      title: 導覽列
      caption: 登入前引導登入，登入後直接顯示餘額和存、提、轉、VIP 入口。
      size: third
      media:
        kind: image
        src: ../../assets/placeholders/placeholder.png
        alt: 88Win Header 元件規格
        aspectRatio: 373 / 148
        status: pending
        expectedFile: src/assets/projects/88win/detail-header.png
      mobileMedia:
        kind: image
        src: ../../assets/placeholders/placeholder.png
        alt: 88Win Header 元件規格手機版
        aspectRatio: 620 / 225
        status: pending
        expectedFile: src/assets/projects/88win/detail-header-mobile.png
    - eyebrow: BUTTON
      title: 按鈕
      caption: 依照擺放的區域和狀態設計不同按鈕，像一般、選中、停用，每個位置都有對應的樣式。
      size: third
      media:
        kind: image
        src: ../../assets/projects/88win/detail-button.png
        alt: 88Win Button 元件規格
        aspectRatio: 811 / 376
    - eyebrow: NAVIGATION
      title: 導覽
      caption: App／H5 的底部導覽列。常用入口固定在底部，中間的首頁用圓形按鈕突出。
      size: third
      media:
        kind: image
        src: ../../assets/projects/88win/detail-navigation.png
        alt: 88Win 手機底部導覽元件規格
        aspectRatio: 393 / 105

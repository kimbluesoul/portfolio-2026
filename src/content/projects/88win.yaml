overview:
  heading: |-
    一套介面規則，
    延伸到**三個裝置**
  blocks:
    - title: 從零開始的第一版
      body: 88Win 的第一版是我從零開始設計的，PC 和 H5／App 加起來有一百多頁。當時的畫面還沒有現在這麼乾淨，但這是整個平台的起點。
    - title: 和設計師一起翻新
      body: 後來和其他設計師一起翻新畫面，同時把介面做成元件，讓整個網站模組化。之後要換色，直接套用就好。
    - title: 最難的地方
      body: 一邊做、一邊會接到新的優化需求。PC 和 H5／App 也不是直接用 RWD 縮放，而是各自設計；畫面這麼多，怎麼管理檔案、維護原型，以及和前端溝通，都是很大的挑戰。
  outputs: [PC, H5, App, 營運活動]
keyScreens:
  eyebrow: DESKTOP
  heading: 資訊很多，**重點**要先被看見
  subtitle: 娛樂城首頁什麼都想放：活動、遊戲、公告、各種入口。我先排好誰最重要，讓畫面再滿也看得到重點。
  main:
    kind: video
    src: /media/88win/key-main.mp4
    poster: ../../assets/projects/88win/key-main-poster.jpg
    alt: 88Win PC 首頁捲動
    aspectRatio: 16 / 9
  closeups:
    - title: Navigation
      caption: 常用入口固定在同一個位置
      media:
        kind: image
        src: ../../assets/projects/88win/key-navigation.jpg
        alt: 88Win 導覽列特寫
        aspectRatio: 458.67 / 300
    - title: Promotion
      caption: 活動圖可以很吸睛，但不能蓋過操作
      media:
        kind: image
        src: ../../assets/projects/88win/key-promotion.jpg
        alt: 88Win 活動區特寫
        aspectRatio: 458.67 / 300
    - title: Game Content
      caption: 先選分類再看遊戲，找起來比較快
      media:
        kind: image
        src: ../../assets/projects/88win/key-game-content.jpg
        alt: 88Win 遊戲內容特寫
        aspectRatio: 458.67 / 300

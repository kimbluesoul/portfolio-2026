        status: pending
        expectedFile: src/assets/projects/88win/key-navigation.jpg
    - title: Promotion
      caption: 活動圖可以很吸睛，但不能蓋過操作
      media:
        kind: image
        src: ../../assets/placeholders/placeholder.png
        alt: 88Win 活動區特寫
        aspectRatio: 458.67 / 300
        status: pending
        expectedFile: src/assets/projects/88win/key-promotion.jpg
    - title: Game Content
      caption: 先選分類再看遊戲，找起來比較快

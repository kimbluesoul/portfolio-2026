overview:
  heading: 一套介面規則，延伸到三個裝置
  blocks:
    - title: 從零開始的第一版
      body: 88Win 的第一版是我從零開始設計的，PC 和 H5／App 加起來有一百多頁。當時的畫面還沒有現在這麼乾淨，但這是整個平台的起點。
    - title: 和設計師一起翻新
      body: 後來和其他設計師一起翻新畫面，同時把介面做成元件，讓整個網站模組化。之後要換色，直接套用就好。
  outputs: [PC, H5, App, Design System]
keyScreens:
  eyebrow: DESKTOP
  heading: 資訊很多，重點要先被看見
  subtitle: 娛樂城首頁什麼都想放：活動、遊戲、公告、各種入口。我先排好誰最重要，讓畫面再滿也看得到重點。
  main:
    kind: video
    src: /media/88win/key-main.mp4
    poster: ../../assets/placeholders/placeholder.png

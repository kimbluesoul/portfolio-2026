motion:
  eyebrow: INTERACTION & MOTION
  heading: 滾動，點亮 DURO
  subtitle: 品牌識別是動態的重點。依照客戶提供的字母意義，用滾動一步步點亮品牌，讓「可靠」不只是一句標語。
  steps:
    - title: 01　逐字點亮
      body: 隨著滾動，DURO 的字母依序亮起，並帶出各自代表的單字與意義。
      media:
        kind: video
        src: /media/hwa-fong/motion-1.mp4
        poster: ../../assets/projects/hwa-fong/motion-1-poster.jpg
        alt: DURO 字母逐字點亮動態
        aspectRatio: 2528 / 1216
    - title: 02　完整品牌
      body: 每個字母都點亮後，整個 LOGO 一起亮起，呈現完整的品牌形象。
      media:
        kind: video
        src: /media/hwa-fong/motion-2.mp4
        poster: ../../assets/projects/hwa-fong/motion-2-poster.jpg
        alt: DURO 完整品牌點亮動態
        aspectRatio: 2528 / 1216
    - title: 03　探索式互動
      body: 產品與分類加入 Hover 回饋，讓逛輪胎更像在探索，而不只是查資料。
      media:
        kind: video
        src: /media/hwa-fong/motion-3.mp4
        poster: ../../assets/projects/hwa-fong/motion-3-poster.jpg
        alt: 產品與分類 Hover 互動
        aspectRatio: 2528 / 1216

overview:
  heading: |-
    可靠的品牌，
    **完整的產品線**
  blocks:
    - title: 背景
      body: 客戶希望參考其他輪胎品牌的網站，要有方便的搜尋功能，盡可能呈現輪胎種類、清楚的胎紋與產品，同時傳達華豐輪胎可靠的品牌形象。
    - title: 過程
      body: 一開始做得有點卡，找到方向後就順利很多。過程中一邊更認識各種輪胎，一邊把能互動探索的 Motion 融入其中，做得很享受。
    - title: 品牌與產品
      body: 網站不斷強調「可靠」與豐富的產品線：用越野場景和標語建立品牌感，再用小 icon 區分胎種，讓五大類輪胎一目了然。
  outputs: [品牌網站, 互動設計]

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.25.0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: astro-assets
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/assets/**', 'astro.config.*', 'pnpm-lock.yaml') }}
          restore-keys: astro-assets-${{ runner.os }}-
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - if: always() && steps.astro-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/assets/**', 'astro.config.*', 'pnpm-lock.yaml') }}
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: E2E and axe
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
        timeout-minutes: 10
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - run: pnpm test:e2e

  lighthouse:
    name: Lighthouse
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      # Real visitors always have a system CJK font (PingFang, JhengHei, Noto CJK)
      # as the swap fallback; the bare runner has none, which inflates CLS when
      # Noto Sans TC loads. Install a small CJK font so the fallback is realistic.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-microhei
      - run: pnpm lhci
